name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # npm requires a 2FA challenge to publish, so releases are currently cut
      # manually. This step stays a no-op until either an automation token is
      # configured as NPM_TOKEN, or the package is switched to npm trusted
      # publishing (OIDC), which is the better long-term option:
      # https://docs.npmjs.com/trusted-publishers
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured — skipping publish."
            echo "The tarball above was built and tested; publish it manually with:"
            echo "  npm publish --access public"
            exit 0
          fi
          npm publish --provenance --access public
