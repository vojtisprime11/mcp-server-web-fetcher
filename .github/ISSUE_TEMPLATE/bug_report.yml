name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues —
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Tool involved
      options:
        - fetch_page_markdown
        - extract_metadata
        - extract_links
        - server startup / configuration
        - other
    validations:
      required: true

  - type: textarea
    id: arguments
    attributes:
      label: Tool arguments
      description: The exact JSON arguments used, including the URL if it is public.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the error `code` and message, or the unexpected output.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, and MCP client.
      placeholder: Node 22.11 / macOS 15 / Claude Desktop
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Relevant env vars (`WEB_FETCHER_*`), stderr output, or a failing test case.
